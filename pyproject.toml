[project]
name = "ubuzima"
version = "0.1.0"
description = "Ubuzima: AI SRHR health-info navigator backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "alembic",
  "pydantic-settings",
  "pgvector",
  "httpx",
  # later tasks
  "sentence-transformers",
  "cryptography",
  "pyjwt",
  "argon2-cffi",
  "pypdf",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["reportlab", "pytest", "pytest-asyncio", "pytest-cov", "respx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: slow tests needing real models/services (deselect with -m \"not integration\")"]

[tool.setuptools.packages.find]
include = ["app*"]
