services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourStrongPassword
      POSTGRES_DB: ubuzima
    ports:
      - "5434:5432"
    volumes:
      - ubuzima_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ubuzima"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:YourStrongPassword@db:5432/ubuzima
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  ubuzima_pgdata:
