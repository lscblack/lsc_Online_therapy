services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ubuzima
    ports:
      - "5434:5432"
    volumes:
      - ubuzima_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ubuzima"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/ubuzima
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  # DEV ONLY / NEEDS HARDENING before production (see README "Realtime voice: TURN/STUN").
  # TURN relay for WebRTC. Ephemeral creds: the API signs them with TURN_SECRET (use-auth-secret).
  # Relay range is kept small (49160-49200/udp) for dev; widen it and set --external-ip
  # to the public IP in production. Open 3478 (udp+tcp) and the relay range in the firewall.
  coturn:
    image: coturn/coturn
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM:-ubuzima.local}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - --no-tlsv1
      - --no-tlsv1_1
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped
volumes:
  ubuzima_pgdata:
